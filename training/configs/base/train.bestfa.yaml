# BestFA 학습 공통 설정. train.split.bestfa / train.deploy.bestfa 가 이 파일 위에 데이터·길이·이름만 덮는다.
# 설치 구도 변화가 커서 KIMM 보다 기하 증강이 강하고, 원본 크롭 이동(source_crop)을 쓴다.
dataset: bestfa

stages:
  preview_aug: false
  train: true
  export: true

source_crop:  # 세션 ROI 위치 기준 좌우 ±5%p · 아래로 0~5%p 로 원본에서 다시 크롭
  # ROI 하나에 와이어 하나 — 앱이 같은 ROI 로 추론하므로 크게 흔들 필요가 없다.
  # %p 는 남는 폭 기준: 2448×2048 원본 · 640 ROI 면 가로 (2448-640)×5% ≈ ±90px,
  # 세로 (2048-640)×5% ≈ 70px. ROI 가 이미지 위쪽 끝이라 위로는 흔들지 않는다.
  enabled: true
  offset_x: [-5, 5]
  offset_y: [0, 5]

train:
  model: yolo26s-seg.pt
  project: runs/bestfa/segment
  imgsz: 640
  batch: -1  # -1: GPU 메모리에 맞춘 자동 배치
  device: "0"  # GPU 인덱스 또는 cpu
  workers: 8
  # fp32 학습. AMP(fp16) 를 켜면 마스크 헤드 proto.cv2 의 BN 분산이 epoch 50 쯤 fp16 상한(65504)에 닿고
  # epoch 113 에서 넘쳐 마스크가 죽었다 (11/16 split, mask mAP 0.745 → 0). KIMM 은 같은 층이 최대 245 로 안전.
  amp: false
  resume: false
  seed: 0
  save_period: 5  # 체크포인트 저장 간격 (epoch)
  patience: 0  # early stopping 끔 — cosine LR 을 끝까지 내린다

  # optimizer 고정: AdamW lr 0.002.
  # auto 는 총 iteration 이 10,000 을 넘으면 MuSGD(lr 0.01) 를 고르는데, 그 실행은
  # best 가 6 epoch 에서 나오고 멈췄다 (BestFA mask mAP50-95 0.216 vs AdamW 0.228).
  optimizer: AdamW
  lr0: 0.002
  momentum: 0.9
  warmup_bias_lr: 0.0
  cos_lr: true

  # 기하 증강
  degrees: 25.0
  translate: 0.0  # source_crop 이동과 중복하지 않음 (train.py 가 강제)
  scale: 0.2
  shear: 2.0
  perspective: 0.0002
  fliplr: 0.5
  flipud: 0.0
  mosaic: 0.0
  close_mosaic: 0
  mixup: 0.0
  copy_paste: 0.0

  # 색 증강 (hsv 대신 사용자 증강)
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  brightness:  # 밝기 배율 (로그 균등)
    p: 0.8
    gain: [0.5, 2.0]
  gamma:  # 감마 배율 (로그 균등)
    p: 0.8
    gain: [0.5, 2.0]
  blur:  # Gaussian sigma (px)
    p: 0.2
    sigma: [1.0, 3.0]

overlay:
  enabled: true

export:
  format: onnx
  opset: 12
  nms: false  # 앱의 YOLO26 추론 형식에 맞춤
  simplify: true
  half: false
  dynamic: false
  weights: [best, last]  # 내보낼 체크포인트 → weights/best.onnx · last.onnx (best = val 로 고른 epoch, last = 마지막)

preview:
  project: runs/preview
  name: aug
  fraction: 0.1
