# 공통 학습 옵션. 모델·데이터·학습 길이는 train.*.yaml에서 지정.
stages:
  preview_aug: false
  train: true
  export: true

train:
  imgsz: 640
  batch: -1  # -1: GPU 메모리에 맞춘 자동 배치
  device: "0"  # GPU 인덱스 또는 cpu
  workers: 8
  resume: false
  optimizer: auto
  cos_lr: true
  seed: 0
  save_period: 5  # 체크포인트 저장 간격 (epoch)

  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  # 환경별 기하 증강은 kimm.yaml / bestfa.yaml에서 지정.
  flipud: 0.0
  mosaic: 0.0
  close_mosaic: 0
  mixup: 0.0
  copy_paste: 0.0
  brightness:  # 사용자 증강: 밝기 배율 (로그 균등)
    p: 0.8
    gain: [0.5, 2.0]
  gamma:  # 사용자 증강: 감마 배율 (로그 균등)
    p: 0.8
    gain: [0.5, 2.0]
  blur:  # 사용자 증강: Gaussian sigma (px)
    p: 0.2
    sigma: [1.0, 3.0]

overlay:
  enabled: true

export:
  format: onnx
  opset: 12
  nms: false  # 앱의 YOLO26 추론 형식에 맞춤
  simplify: true
  half: false
  dynamic: false

preview:
  project: runs/preview
  name: aug
  fraction: 0.1
