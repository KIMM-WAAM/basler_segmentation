# BestFA 배포용: train+val 전체로 학습 + ONNX export. 앱 반영은 archive.py → weights/deploy.yaml.
# epochs = train.split.bestfa 의 best epoch. 54 = 11/16 split(261116_205043, 141세션 새 데이터)의 best
# (mask mAP50-95 0.745, epoch 50~100 동안 0.742~0.745 로 평평).
base: base/train.bestfa.yaml

train:
  data: ../datasets/bestfa/processed_seg/data.all.yaml
  epochs: 54
  name: bestfa-yolo26s-seg-deploy
