# BestFA: 와이어 2개. 세션 분할 설정. 크롭은 아래 rois (세션 crop.yaml 은 쓰지 않음).
dataset: bestfa
wire_count: 2
reference:
  directory: ../datasets/bestfa/reference
  opacity: 0.35
  outline_opacity: 0.9
  wire_mask: red
  white_background: true
names: {0: wire}
seed: 0
task: seg
out: ../datasets/bestfa/processed_seg
preview:
  enabled: true
  count: 12
sources:
  - name: bestfa
    path: ../datasets/bestfa/raw/[0-9]*
    labels: labels_seg
    names: {0: wire}
    class_map: {wire: wire}
    type: seg
    group_by: session
    # 세션 통째로 분리. val 은 고정 19세션 (2026-11-15, 라벨된 124세션에서 seed 0 · val_ratio 0.15 로
    # 뽑힌 그대로 — 3,602 / 23,420 ROI 샘플). 세션이 늘어도 val 은 그대로, 새 세션은 train.
    # 예전 분할(261026_144002 = val)은 그 세션들이 raw 에 다시 들어오면 추가 — 없는 세션을 적으면 멈춤.
    val_sessions:
      - '261111_094900'  # layer 18
      - '261111_115652'  # layer 32
      - '261111_123803'  # layer 37
      - '261111_132519'  # layer 40
      - '261111_140244'  # layer 45
      - '261111_164016'  # layer 64
      - '261111_165547'  # layer 66
      - '261112_092724'  # layer 72
      - '261112_094420'  # layer 75
      - '261112_165507'  # layer 94
      - '261113_090535'  # layer 98
      - '261113_100558'  # layer 107
      - '261113_103145'  # layer 113
      - '261113_140038'  # layer 134
      - '261113_141633'  # layer 137
      - '261113_142426'  # layer 138
      - '261113_143349'  # layer 140
      - '261113_153959'  # layer 148
      - '261113_164526'  # layer 157
    test_ratio: 0.0
    oversample: 1
    resize: null
    # 이미지 한 장 → 640×640 창 두 개 (와이어 하나씩, 같은 모델로 따로 추론). 11/11~ 구도 고정이라
    # 모든 세션에 같은 창. 위치 규약은 crop 과 같다 (0% = 왼쪽/위 끝, 100% = 오른쪽/아래 끝).
    # 2448×2048 원본 기준 r1 = x 723~1363, r2 = x 1338~1978, 둘 다 y 211~851. 자동 라벨 12,488장에서
    # seg 는 전부 제 창 안 (오른쪽 와이어는 r2 왼쪽 경계에서 ~75px — 학습 이동 ±5%p = ±90px).
    rois:
      - {name: r1, width: 640, height: 640, center_x: 40, center_y: 15}   # 왼쪽 와이어
      - {name: r2, width: 640, height: 640, center_x: 74, center_y: 15}   # 오른쪽 와이어
