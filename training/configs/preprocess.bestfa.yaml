# BestFA: 와이어 2개. 세션 분할 설정. 크롭은 각 세션의 crop.yaml에 저장.
dataset: bestfa
wire_count: 2
reference:
  directory: ../datasets/bestfa/reference
  opacity: 0.35
  outline_opacity: 0.9
  wire_mask: red
  white_background: true
names: {0: wire}
seed: 0
task: seg
out: ../datasets/bestfa/processed_seg
preview:
  enabled: true
  count: 12
sources:
  - name: bestfa
    path: ../datasets/bestfa/raw/[0-9]*
    labels: labels_seg
    names: {0: wire}
    class_map: {wire: wire}
    type: seg
    group_by: session
    # 세션 통째로 분리. 1층·3층과 새 세션은 train, 2층만 val.
    val_sessions:
      - '261026_144002'  # layer 2
    test_ratio: 0.0
    oversample: 1
    resize: null
