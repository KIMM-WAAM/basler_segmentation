# KIMM: 와이어 1개. 세션 분할 설정. 크롭은 각 세션의 crop.yaml에 저장.
dataset: kimm
wire_count: 1
reference:
  directory: ../datasets/kimm/reference
  opacity: 0.35
  outline_opacity: 0.9

names:
  0: wire

seed: 0

preview:
  enabled: true
  count: 12

task: seg

out: ../datasets/kimm/processed_seg

sources:
  - name: kimm
    path: ../datasets/kimm/raw/[0-9]*
    labels: labels_seg
    names: {0: wire}
    class_map:
      wire: wire
    group_by: session
    val_ratio: 0.2
    test_ratio: 0.1
    val_sessions:  # 고정 세션. val_ratio 대신 사용
      - '261019_160703'
      - '261014_183709'
      - '261019_153805'
    test_sessions:  # 고정 세션. 나머지 세션은 train
      - '261019_161818'
      - '261014_182249'
      - '261014_174102'
    oversample: 1
    resize: null
    type: seg
