# KIMM: 와이어 1개. 세션 분할 설정. 크롭은 각 세션의 crop.yaml에 저장.
dataset: kimm
wire_count: 1
reference:
  directory: ../datasets/kimm/reference
  opacity: 0.35
  outline_opacity: 0.9

names:
  0: wire

seed: 0

preview:
  enabled: true
  count: 12

task: seg

out: ../datasets/kimm/processed_seg

sources:
  - name: kimm
    path: ../datasets/kimm/raw/[0-9]*
    labels: labels_seg
    names: {0: wire}
    class_map:
      wire: wire
    group_by: session
    val_ratio: 0.2
    test_ratio: 0.1
    # 새 kimm (2026-11-13, basler_data 80세션). 같은 날 연속 세션은 서로 근중복이라 묶음째로 나눈다.
    # 예전 kimm_old 의 분할: val 261019_160703 · 261014_183709 · 261019_153805,
    #                       test 261019_161818 · 261014_182249 · 261014_174102
    val_sessions:  # 고정 세션. val_ratio 대신 사용 (716장)
      - '261025_223137'  # slope_steep 제어 묶음 (train 에는 261024 slope_steep 묶음)
      - '261025_231217'
      - '261025_232033'
      - '261025_232600'
      - '261103_172559'  # circle2_2.5 (circle1·3 은 train)
      - '261106_150912'  # audio 묶음 100~20
      - '261106_151019'
      - '261106_151111'
      - '261106_151208'
      - '261106_151310'
      - '261106_151424'
    test_sessions:  # 고정 세션. 나머지 세션은 train (640장)
      - '261104_153903'  # final3 (final·final2 는 train)
      - '261104_164328'  # gaspore (gaspore2·3 은 train)
      - '261109_141338'  # 261109 묶음
      - '261109_154305'
      - '261109_160248'
      - '261110_140326'  # 어두운 261110 오후 (오전은 train)
      - '261110_140720'
      - '261110_150305'
    oversample: 1
    resize: null
    type: seg
